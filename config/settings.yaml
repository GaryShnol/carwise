# Single place for every tunable value; no magic numbers in code.
# Values marked "provisional" are placeholders until the eval tunes them
# (CW-303 for retrieval and chunking, CW-305 for the embedding model).

default_profile: dev   # override with env CARWISE_PROFILE or the --profile flag

profiles:
  dev:    # almost all development: cheapest model for both calls
    base_url: null     # null = OpenAI; env OPENAI_BASE_URL overrides
    understand_model: gpt-5.4-nano
    generate_model: gpt-5.4-nano
  final:  # published numbers, sample conversation, screenshots
    base_url: null
    understand_model: gpt-5.4-nano
    generate_model: gpt-5.4-mini

llm:
  # Sampling controls; null means "do not send". Measured in the CW-104 spike
  # (docs/decisions/0001-llm-sampling-controls.md): both gpt-5.4 models accept
  # all three. "none" is sent explicitly so a provider default cannot add
  # reasoning tokens (cost and latency); "minimal" is rejected by these models.
  temperature: 0.0
  reasoning_effort: none   # none | low | medium | high
  seed: 7
  timeout_s: 30
  retries: 1
  history_window: 6    # last N messages sent to the understanding call
  max_cost_usd: 2.0    # abort a run (eval or chat session) above this

# USD per 1M tokens, Standard tier. Verified on 2026-10-30 against
# https://developers.openai.com/api/docs/pricing (CW-104). Reasoning tokens are
# billed as output tokens. A model missing here is refused by the client; local
# models get explicit zeros.
prices:
  gpt-5.4-nano: { input: 0.20, cached_input: 0.02, output: 1.25 }
  gpt-5.4-mini: { input: 0.75, cached_input: 0.075, output: 4.50 }

embeddings:
  provider: sentence_transformers        # or "fake": hash-based, no download (tests, offline CI)
  model: intfloat/multilingual-e5-large  # chosen in CW-305, see docs/decisions/0002
  revision: 3d7cfbdacd47fdda877c5cd8a79fbcc4f2a574f3   # Hugging Face commit, pinned in CW-305
  query_prefix: "query: "                # e5 models are trained with these prefixes
  passage_prefix: "passage: "
  device: cpu
  batch_size: 16

chunking:              # provisional, tuned in CW-303
  min_chars: 300
  max_chars: 1400     # CW-303: largest value with no chunk over e5's 512 tokens (was 1500)
  # CW-303: the embedded header carries the section as the same short label users see
  # (merged headings ran to 150+ characters and pushed 5 chunks past e5's 512 tokens).
  embed_section_chars: 60
  spec_header: false   # CW-303 option A (measured, not chosen): table labels in the embedded header

retrieval:             # provisional, tuned in CW-303
  top_k: 5               # single-car questions
  per_car_cap: 3         # comparisons: chunks per named car
  cross_car_top_k: 12    # recommendation and ranking questions across all cars...
  cross_car_per_car_cap: 2   # ...with at most this many chunks per car, so most cars appear
  relevance_threshold: 0.0   # cosine; 0 disables it until CW-303 tunes it on the eval
  lexical:                   # CW-305: BM25 fused with the dense ranking (reciprocal rank fusion)
    enabled: false           # the order changes; scores stay cosine, so the gate is unaffected
    rrf_k: 60                # the usual RRF constant (Cormack et al. 2009), not tuned
    bm25_k1: 1.5             # the usual Okapi BM25 defaults, not tuned
    bm25_b: 0.75
  force_spec_box: true       # CW-303 option B (chosen): each named car's spec box for compare/recommend

input:
  max_message_chars: 500       # the current message; longer is refused politely
  # Message plus history window sent to the understand call (CW-205). User messages
  # in the window are also held to max_message_chars; the oldest messages are
  # dropped first. Answers run to about 1,000 characters, so 6 messages fit.
  max_turn_input_chars: 6000

preferences:           # CW-203: one conversation only, never written to disk
  max_value_chars: 80  # a preference longer than this is cut (and flagged)

guardrails:
  # Well-known brands with no article in the corpus (CW-105 gate, CW-202 post-check).
  # A question naming only these is refused without a generation call. Brands that
  # are in the corpus (Citroen, Audi, Kia, MG, Hyundai, GAC, Lynk & Co, Genesis) must
  # never appear here; a test checks it. Hebrew "ג'יפ" is left out on purpose: it is
  # everyday slang for any SUV.
  outside_brands:
    - טויוטה
    - Toyota
    - ב.מ.וו
    - ב.מ.ו
    - BMW
    - מרצדס
    - Mercedes
    - טסלה
    - Tesla
    - מאזדה
    - Mazda
    - הונדה
    - Honda
    - סקודה
    - Skoda
    - פולקסווגן
    - Volkswagen
    - VW
    - סובארו
    - Subaru
    - ניסאן
    - Nissan
    - פורד
    - Ford
    - פיג'ו
    - Peugeot
    - רנו
    - Renault
    - BYD
    - וולוו
    - Volvo
    - שברולט
    - Chevrolet
    - סוזוקי
    - Suzuki
    - מיצובישי
    - Mitsubishi
    - פורשה
    - Porsche
    - לקסוס
    - Lexus
    - Jeep
    - סיאט
    - Seat
    - קופרה
    - Cupra
    - צ'רי
    - Chery
    - אופל
    - Opel
    - פיאט
    - Fiat
    - דאצ'יה
    - Dacia
    - זיקר
    - Zeekr
    - אקספנג
    - XPeng
  # Refusals (CW-201) suggest the closest of the eight cars. Without outside knowledge
  # the only grounded signal is the user's own words: these hint words map to the
  # registry's body_type and powertrain values. A car scores one point per matching
  # dimension; the best-scoring cars are suggested. With no hint, the cars of the
  # best-scoring retrieved chunks are suggested instead, and with neither, the reply
  # lists all eight grouped by powertrain.
  max_suggestions: 3
  body_type_words:
    supermini: [סופרמיני, עירוני, עירונית]
    hatchback: [האצ'בק, Hatchback]
    sedan: [סדאן, סדן, Sedan]
    suv: [פנאי, SUV, ג'יפ, ג'יפון, קרוסאובר, Crossover]
    suv_coupe: [פנאי, פנאי-קופה, קופה, Coupe]   # an SUV coupe is an SUV too
  powertrain_words:
    petrol: [בנזין, בנזינים]
    mild_hybrid: [היברידי, היברידית, היברידיים, Hybrid]
    plug_in_hybrid: [היברידי, היברידית, היברידיים, נטען, נטענת, פלאג-אין, PHEV, Hybrid]
    electric: [חשמלי, חשמלית, חשמליים, חשמליות]
  # Numeric post-check (CW-206): numbers that never need a source. 0 is the start
  # of "0-100", which answers write even when the article says only "ל-100".
  numbers_always_allowed: [0]

display:              # what the user sees; telemetry and Citation keep the full value
  max_section_chars: 60   # merged headings can run to 150+ chars; cut at a word boundary

fetch:                 # polite download of the eight articles (CW-101)
  user_agent: "carwise-takehome/0.1 (+https://github.com/GaryShnol/carwise)"
  delay_s: 3.0         # between requests; robots.txt Crawl-delay wins if larger
  timeout_s: 20
  retries: 1           # network errors and 5xx only, never a 4xx

eval:                  # CW-302: every real-model eval run prints its cost and stops at its cap
  record_max_cost_usd: 0.10   # recording the understand outputs (about 30 nano calls)

paths:
  raw_dir: data/raw
  index_dir: data/index
  log_dir: logs
