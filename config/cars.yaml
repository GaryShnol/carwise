# Car registry: the single source of car names for ingestion, the understand
# prompt, the relevance gate and the post-check (CLAUDE.md section 6).
#
# Rules for every field:
# - aliases are spellings the article itself uses for the tested car. A spelling
#   that contains Hebrew letters goes in aliases_he, a pure Latin one in
#   aliases_latin. Brand-only names and very generic model codes ("HT", "N",
#   "01") are left out, because they would match unrelated text.
# - body_type and powertrain come from the article text only, never from outside
#   knowledge. The *_quote field holds the few words of the article that support
#   the value. If the article does not say it, the value and the quote are null.
#
# body_type values:  supermini | hatchback | sedan | suv | suv_coupe
# powertrain values: petrol | mild_hybrid | plug_in_hybrid | electric

cars:
  - id: citroen_c3
    display_name: סיטרואן C3
    aliases_he: [סיטרואן C3]
    aliases_latin: [C3]
    body_type: supermini
    body_type_quote: סופרמיני מוגבהת
    powertrain: mild_hybrid
    powertrain_quote: טורבו-בנזין 1.2 ליטר … מערך היברידי מתון
    url: https://www.auto.co.il/articles/test-drives/road-tests/citroen-c3-2026/
    slug: citroen-c3-2026

