# Automatic checks on every push to main or an epic branch, and on every pull request
# to main: lint, format, types and the unit tests. Offline by design: the tests use
# synthetic chunks, a fake embedder and a fake LLM, so no articles, no model download
# and no API key. The evals that need those are manual (eval.yml).
#
# Safe for pull requests from forks: the `pull_request` event gets a read-only token
# and no secrets, and this workflow uses none. Actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"] # the floor in pyproject.toml, and the version used locally
    env:
      # Any model download in a unit test is a bug; fail instead of fetching.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (exactly the lock file)
        run: uv sync --locked

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: mypy
        run: uv run --no-sync mypy src app eval

      - name: pytest (unit tests; slow and live tests are deselected by default)
        run: uv run --no-sync pytest
